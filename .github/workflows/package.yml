name: package-skill
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: reporeel-skill
          path: dist/reporeel.zip
