<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">RepoReel in one flow: roast, fix, diff</title>
  <desc id="desc">A repository starts blocked at 2 out of 100, RepoReel identifies the Reel Breaker, fixes the Front Door and launch blockers, and the repo reaches 87 out of 100 ready.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b09"/><stop offset="1" stop-color="#101713"/></linearGradient>
    <radialGradient id="glow" cx="78%" cy="15%" r="80%"><stop stop-color="#52f28b" stop-opacity=".13"/><stop offset="1" stop-color="#52f28b" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1400" height="620" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="620" rx="30" fill="url(#glow)"/>
  <rect x="1" y="1" width="1398" height="618" rx="29" fill="none" stroke="#243129"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="64" y="62" fill="#52f28b" font-size="17" font-weight="800" letter-spacing="3">REPOREEL / 20-SECOND DEMO</text>
    <text x="64" y="104" fill="#f4f4f5" font-size="30" font-weight="760">Your repo gets roasted. The evidence tells you what to fix.</text>
    <g transform="translate(64 145)" filter="url(#shadow)">
      <rect width="360" height="390" rx="24" fill="#0d100e" stroke="#2b312d"/>
      <text x="28" y="42" fill="#a1a1aa" font-size="13" font-weight="800" letter-spacing="2">01 / ROAST</text>
      <text x="28" y="112" fill="#ff6b6b" font-size="64" font-weight="850">02</text>
      <text x="107" y="110" fill="#71717a" font-size="18" font-weight="650">/100</text>
      <rect x="28" y="135" width="118" height="31" rx="15" fill="#33191b" stroke="#733337"/>
      <text x="87" y="156" fill="#ff8080" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1">BLOCKED</text>
      <text x="28" y="215" fill="#71717a" font-size="12" font-weight="800" letter-spacing="1.6">THE REEL BREAKER</text>
      <text x="28" y="250" fill="#f4f4f5" font-size="19" font-weight="700">No Front Door.</text>
      <text x="28" y="278" fill="#d4d4d8" font-size="15">No README, no run path,</text>
      <text x="28" y="301" fill="#d4d4d8" font-size="15">and a public claim exceeds code.</text>
      <line x1="28" y1="330" x2="332" y2="330" stroke="#27272a"/>
      <text x="28" y="358" fill="#ff8585" font-size="13" font-weight="700">3 launch blockers found</text>
    </g>
    <g transform="translate(447 323)">
      <line x1="0" y1="0" x2="68" y2="0" stroke="#3f4b43" stroke-width="3"/>
      <path d="M58 -10 L72 0 L58 10" fill="none" stroke="#52f28b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(520 145)" filter="url(#shadow)">
      <rect width="360" height="390" rx="24" fill="#0d100e" stroke="#2b312d"/>
      <text x="28" y="42" fill="#a1a1aa" font-size="13" font-weight="800" letter-spacing="2">02 / FIX</text>
      <text x="28" y="92" fill="#f4f4f5" font-size="23" font-weight="760">Evidence-backed changes</text>
      <g font-size="15" font-weight="650">
        <circle cx="36" cy="140" r="10" fill="#173d25"/><path d="M31 140 l4 4 l7 -9" fill="none" stroke="#70f09c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="145" fill="#d4d4d8">Front Door rewritten</text>
        <circle cx="36" cy="188" r="10" fill="#173d25"/><path d="M31 188 l4 4 l7 -9" fill="none" stroke="#70f09c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="193" fill="#d4d4d8">Quick start proven</text>
        <circle cx="36" cy="236" r="10" fill="#173d25"/><path d="M31 236 l4 4 l7 -9" fill="none" stroke="#70f09c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="241" fill="#d4d4d8">Contradicted claim corrected</text>
        <circle cx="36" cy="284" r="10" fill="#173d25"/><path d="M31 284 l4 4 l7 -9" fill="none" stroke="#70f09c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="289" fill="#d4d4d8">Visual proof surfaced</text>
      </g>
      <line x1="28" y1="330" x2="332" y2="330" stroke="#27272a"/>
      <text x="28" y="358" fill="#a1a1aa" font-size="13">No invented stars, benchmarks or claims.</text>
    </g>
    <g transform="translate(903 323)">
      <line x1="0" y1="0" x2="68" y2="0" stroke="#3f4b43" stroke-width="3"/>
      <path d="M58 -10 L72 0 L58 10" fill="none" stroke="#52f28b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(976 145)" filter="url(#shadow)">
      <rect width="360" height="390" rx="24" fill="#0d100e" stroke="#2b312d"/>
      <text x="28" y="42" fill="#a1a1aa" font-size="13" font-weight="800" letter-spacing="2">03 / DIFF</text>
      <text x="28" y="122" fill="#71717a" font-size="50" font-weight="820">02</text>
      <line x1="102" y1="104" x2="128" y2="104" stroke="#52525b" stroke-width="3"/><path d="M120 97 L130 104 L120 111" fill="none" stroke="#52525b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="148" y="122" fill="#b8ff5a" font-size="64" font-weight="850">87</text>
      <text x="249" y="118" fill="#b8ff5a" font-size="17" font-weight="800">+85</text>
      <rect x="28" y="149" width="92" height="30" rx="15" fill="#33191b" stroke="#733337"/>
      <text x="74" y="169" fill="#ff8080" text-anchor="middle" font-size="12" font-weight="800">BLOCKED</text>
      <line x1="134" y1="164" x2="153" y2="164" stroke="#52525b" stroke-width="2"/><path d="M147 158 L155 164 L147 170" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="166" y="149" width="82" height="30" rx="15" fill="#173d25" stroke="#2c7145"/>
      <text x="207" y="169" fill="#70f09c" text-anchor="middle" font-size="12" font-weight="800">READY</text>
      <text x="28" y="229" fill="#71717a" font-size="12" font-weight="800" letter-spacing="1.6">SHAREABLE OUTPUT</text>
      <text x="28" y="264" fill="#f4f4f5" font-size="19" font-weight="720">card.svg</text>
      <text x="28" y="292" fill="#f4f4f5" font-size="19" font-weight="720">report.html</text>
      <text x="28" y="320" fill="#f4f4f5" font-size="19" font-weight="720">diff.svg</text>
      <line x1="28" y1="341" x2="332" y2="341" stroke="#27272a"/>
      <text x="28" y="370" fill="#70f09c" font-size="13" font-weight="700">Validated from audit.json</text>
    </g>
    <text x="700" y="585" fill="#7f8d84" text-anchor="middle" font-size="13">Sample flow · scores are launch-readiness scores, not code-quality scores.</text>
  </g>
</svg>
