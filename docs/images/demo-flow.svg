<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">Evidock in one flow: roast, fix, diff</title><desc id="desc">A repository starts blocked at 2 out of 100, Evidock identifies the Ship Blocker, fixes evidence-backed launch surfaces, and the repository reaches 87 out of 100 ready.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b09"/><stop offset="1" stop-color="#101713"/></linearGradient></defs><rect width="1400" height="620" rx="30" fill="url(#bg)"/><rect x="1" y="1" width="1398" height="618" rx="29" fill="none" stroke="#243129"/><g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif"><text x="64" y="62" fill="#52f28b" font-size="17" font-weight="800" letter-spacing="3">EVIDOCK / 20-SECOND DEMO</text><text x="64" y="104" fill="#f4f4f5" font-size="30" font-weight="760">Evidence tells you what blocks the launch and what to fix.</text><g transform="translate(64 145)"><rect width="360" height="390" rx="24" fill="#0d100e" stroke="#2b312d"/><text x="28" y="42" fill="#a1a1aa" font-size="13" font-weight="800" letter-spacing="2">01 / ROAST</text><text x="28" y="112" fill="#ff6b6b" font-size="64" font-weight="850">02</text><text x="107" y="110" fill="#71717a" font-size="18">/100</text><text x="28" y="160" fill="#ff8080" font-size="13" font-weight="800">BLOCKED</text><text x="28" y="215" fill="#71717a" font-size="12" font-weight="800" letter-spacing="1.6">THE SHIP BLOCKER</text><text x="28" y="250" fill="#f4f4f5" font-size="19" font-weight="700">No Front Door.</text><text x="28" y="282" fill="#d4d4d8" font-size="15">No README, no run path,</text><text x="28" y="305" fill="#d4d4d8" font-size="15">and a claim exceeds evidence.</text><text x="28" y="360" fill="#ff8585" font-size="13" font-weight="700">3 launch blockers found</text></g><text x="470" y="335" fill="#52f28b" font-size="34">→</text><g transform="translate(520 145)"><rect width="360" height="390" rx="24" fill="#0d100e" stroke="#2b312d"/><text x="28" y="42" fill="#a1a1aa" font-size="13" font-weight="800" letter-spacing="2">02 / FIX</text><text x="28" y="92" fill="#f4f4f5" font-size="23" font-weight="760">Evidence-backed changes</text><g fill="#d4d4d8" font-size="15" font-weight="650"><text x="28" y="145">✓ Front Door rewritten</text><text x="28" y="193">✓ Quick start proven</text><text x="28" y="241">✓ Contradicted claim corrected</text><text x="28" y="289">✓ Visual proof surfaced</text></g><text x="28" y="358" fill="#a1a1aa" font-size="13">No invented stars, benchmarks or claims.</text></g><text x="926" y="335" fill="#52f28b" font-size="34">→</text><g transform="translate(976 145)"><rect width="360" height="390" rx="24" fill="#0d100e" stroke="#2b312d"/><text x="28" y="42" fill="#a1a1aa" font-size="13" font-weight="800" letter-spacing="2">03 / DIFF</text><text x="28" y="122" fill="#71717a" font-size="50" font-weight="820">02</text><text x="112" y="115" fill="#52525b" font-size="28">→</text><text x="160" y="122" fill="#b8ff5a" font-size="64" font-weight="850">87</text><text x="260" y="118" fill="#b8ff5a" font-size="17" font-weight="800">+85</text><text x="28" y="175" fill="#ff8080" font-size="12" font-weight="800">BLOCKED</text><text x="110" y="175" fill="#71717a" font-size="14">→</text><text x="145" y="175" fill="#70f09c" font-size="12" font-weight="800">READY</text><text x="28" y="229" fill="#71717a" font-size="12" font-weight="800" letter-spacing="1.6">SHAREABLE OUTPUT</text><text x="28" y="264" fill="#f4f4f5" font-size="19">card.svg</text><text x="28" y="292" fill="#f4f4f5" font-size="19">report.html</text><text x="28" y="320" fill="#f4f4f5" font-size="19">diff.svg + badge.svg</text><text x="28" y="370" fill="#70f09c" font-size="13" font-weight="700">Validated from audit.json</text></g><text x="700" y="585" fill="#7f8d84" text-anchor="middle" font-size="13">Sample flow · Launch Score measures launch readiness, not code quality.</text></g></svg>
