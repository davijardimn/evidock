<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
<title id="t">Evidock</title><desc id="d">Evidence before you ship. Evidence-first launch audits for software repositories.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0f0d"/><stop offset="1" stop-color="#131a16"/></linearGradient><radialGradient id="r" cx="75%" cy="25%"><stop stop-color="#52f28b" stop-opacity=".22"/><stop offset="1" stop-color="#52f28b" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="460" rx="28" fill="url(#g)"/><rect width="1200" height="460" rx="28" fill="url(#r)"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#e9f0eb"><text x="70" y="105" font-size="24" letter-spacing="5" fill="#52f28b">EVIDOCK</text><text x="70" y="188" font-size="48" font-weight="700">Evidence before you ship.</text><text x="70" y="250" font-size="25" fill="#c9d6cd">Audit the repo people see — not just the code you wrote.</text><text x="70" y="310" font-size="22" fill="#9fb0a5">Audit · prove · score · fix · launch</text><g transform="translate(820 90)"><rect width="290" height="280" rx="18" fill="#0a0d0b" stroke="#26352b"/><text x="28" y="52" font-size="15" fill="#8b9b90">LAUNCH SCORE</text><text x="28" y="132" font-size="72" font-weight="700">92</text><text x="130" y="132" font-size="20" fill="#8b9b90">/100</text><rect x="28" y="158" width="105" height="32" rx="16" fill="#173d25"/><text x="48" y="180" font-size="14" fill="#70f09c">READY</text><text x="28" y="230" font-size="13" fill="#8b9b90">Market the evidence.</text><text x="28" y="253" font-size="13" fill="#8b9b90">Never manufacture it.</text></g></g></svg>
